<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property Portfolio Dashboard (sample data)</title>
<style>
/* Layout: sticky ledger header + tab rail; summary tiles, then attention list, then detail.
   Light only, by choice: Arial, single purple ramp, no gridlines, no hue for good/bad. */
:root{
  --bg:#FAF8FC; --surface:#FFFFFF; --ink:#262626; --muted:#737373; --line:#E3DAEE;
  --p1:#3F2A5C; --p2:#5B3D86; --p3:#7851A9; --p4:#A58BC9; --p5:#CBBBE0; --p6:#EAE3F3;
  --on-accent:#FFFFFF; --font:Arial,Helvetica,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  border-bottom:1px solid var(--line)}
.top .wrap{padding-block:14px 0}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;justify-content:space-between}
h1{font-size:19px;margin:0;line-height:1.15;color:var(--p1);letter-spacing:.2px;text-wrap:balance}
.mark{display:flex;align-items:center;gap:10px}
.firm{font-size:11px;font-weight:700;letter-spacing:2.6px;color:var(--p3)}
.meta{color:var(--muted);font-size:12.5px;display:flex;gap:6px 14px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font:600 13px var(--font);background:none;border:0;color:var(--muted);
  padding:9px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--p2);border-bottom-color:var(--p3)}
nav.tabs button:hover{color:var(--ink)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--p3);outline-offset:2px}
section.view{display:grid;gap:22px;padding-top:20px}
h2{font-size:16px;margin:0 0 10px;color:var(--p1)}
h3{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.note{color:var(--muted);font-size:12.5px;margin:0;max-width:75ch}
.grid{display:grid;gap:12px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  display:grid;gap:2px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.tile .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile svg{display:block;margin-top:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
/* alerts: severity encoded by stripe weight + glyph + word, never by hue */
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;border-radius:6px;
  background:var(--p6);border-left:6px solid var(--p2)}
.alert.upcoming{border-left:6px double var(--p3);background:transparent;border:1px solid var(--line);border-left-width:6px}
.alert.info{border-left:2px solid var(--p4);background:transparent;border-top:0;border-right:0;border-bottom:0}
.alert .g{font-size:15px;line-height:1.2;color:var(--p2)}
.alert .t{font-weight:700;font-size:13.5px}
.alert .s{font-size:12.5px;color:var(--muted)}
.alert .w{font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--p2);margin-right:6px}
/* property cards */
.cards{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  display:grid;grid-template-rows:auto 1fr;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0}
.card:hover{border-color:var(--p4)}
.card .ph{height:76px;background:var(--p6);position:relative;display:flex;align-items:flex-end;padding:10px 12px}
.card .ph svg{position:absolute;inset:0;width:100%;height:100%}
.card .ph .st{position:relative}
.card .body{padding:12px;display:grid;gap:8px;align-content:start}
.card .name{font-weight:700;font-size:15px;color:var(--p1)}
.card .addr{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:12.5px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.4px;
  padding:3px 8px;border-radius:999px;background:var(--p3);color:var(--on-accent);white-space:nowrap}
.chip.soft{background:var(--surface);color:var(--p2);border:1px solid var(--p4)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.4px;padding:1px 6px;border-radius:4px;
  text-transform:uppercase;vertical-align:1px}
.b-actual{background:var(--p3);color:var(--on-accent)}
.b-modelled{border:1px dashed var(--p3);color:var(--p2)}
.b-estimate{border:1px dotted var(--p3);color:var(--p2)}
.b-confirmed{border:1px solid var(--p4);color:var(--p2)}
/* tables: purple header, light rules, no grid */
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th{background:var(--p3);color:var(--on-accent);text-align:right;font-weight:700;padding:7px 10px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td.l,th.l{text-align:left;white-space:normal}
tr.total td{font-weight:700;border-top:2px solid var(--p3);border-bottom:0}
tr.sub td{color:var(--muted)}
td.mod{font-style:italic;color:var(--muted)}
.selector{display:flex;flex-wrap:wrap;gap:8px}
.selector button{font:600 13px var(--font);padding:7px 12px;border-radius:999px;border:1px solid var(--p4);
  background:var(--surface);color:var(--p2);cursor:pointer}
.selector button[aria-pressed="true"]{background:var(--p3);color:var(--on-accent);border-color:var(--p3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.chart text{fill:var(--muted);font:11px var(--font)}
.chart .lbl{fill:var(--ink);font-weight:700}
.empty{color:var(--muted);font-size:13px;padding:14px;border:1px dashed var(--line);border-radius:6px}
.cal{display:grid;gap:0}
.cal .row{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.cal .dt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--p2)}
.cal .past .dt{color:var(--muted);font-weight:400}
.foot{color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:520px){.tile .v{font-size:19px}.cal .row{grid-template-columns:1fr;gap:2px}}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>

    g+=`<text x="${(x+w/2).toFixed(1)}" y="${h-8}" text-anchor="middle">${mshort(s.month)}${s.month.endsWith("-01")||i===0?" "+s.month.slice(2,4):""}</text>`;
    if(i===series.length-1||i===vals.indexOf(mn)||i===vals.indexOf(mx))
      g+=`<text class="lbl" x="${(x+w/2).toFixed(1)}" y="${(v>=0?y0-6:y0+hh+13).toFixed(1)}" text-anchor="middle">${label(v)}</text>`;
  });
  g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  return `<div class="tw"><svg class="chart" width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" role="img">${HATCH}${g}</svg></div>`;
}
function lineChart(lines,{h=200,fmt=kmoney}={}){
  // lines: [{name, pts:[{x:"YYYY-MM", y, mod}], dash}]
  const all=lines.flatMap(l=>l.pts);
  if(!all.length)return`<div class="empty">No data yet.</div>`;
  const xs=[...new Set(all.map(p=>p.x))].sort(),W=620,pad={l:8,r:118,t:14,b:24};
  const ys=all.map(p=>p.y),mn=Math.min(0,...ys),mx=Math.max(0,...ys),r=(mx-mn)||1;
  const X=x=>pad.l+xs.indexOf(x)*(W-pad.l-pad.r)/Math.max(1,xs.length-1),Y=v=>pad.t+(mx-v)/r*(h-pad.t-pad.b);
  const shades=["var(--p1)","var(--p3)","var(--p4)","var(--p2)"],dashes=["","6 4","2 3","10 3 2 3"];
  let g=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)"/>`;
  const used=[];
  lines.forEach((l,i)=>{if(!l.pts.length)return;
    const d=l.pts.map((p,j)=>(j?"L":"M")+X(p.x).toFixed(1)+","+Y(p.y).toFixed(1)).join(" ");
    g+=`<path d="${d}" fill="none" stroke="${shades[i%4]}" stroke-width="2.2" stroke-dasharray="${l.dash??dashes[i%4]}"/>`;
    const last=l.pts[l.pts.length-1];let ly=Y(last.y)+4;while(used.some(u=>Math.abs(u-ly)<13))ly+=13;used.push(ly);
    g+=`<circle cx="${X(last.x)}" cy="${Y(last.y)}" r="3.2" fill="${shades[i%4]}"/>
       <text class="lbl" x="${X(last.x)+7}" y="${ly}">${esc(l.name)} ${fmt(last.y)}</text>`;});
  const step=Math.ceil(xs.length/8);
  xs.forEach((x,i)=>{if(i%step===0||i===xs.length-1)g+=`<text x="${X(x)}" y="${h-6}" text-anchor="middle">${mshort(x)} ${x.slice(2,4)}</text>`});
  return `<div class="tw"><svg class="chart" width="100%" viewBox="0 0 ${W} ${h}" style="min-width:520px" role="img">${g}</svg></div>`;
}
function valueChart(p){
  const v=p.valuations.filter(x=>x.date);if(!v.length)return`<div class="empty">No valuation history.</div>`;
  const W=560,h=170,pad={l:10,r:10,t:22,b:26},s=p.share;
  const t=v.map(x=>new Date(x.date).getTime()),t0=Math.min(...t),t1=Math.max(...t,new Date(D.as_of).getTime());
  const all=v.flatMap(x=>[x.value,x.low||x.value,x.high||x.value]).map(a=>a*s),mn=Math.min(...all)*.9,mx=Math.max(...all)*1.05;
  const X=d=>pad.l+40+((new Date(d).getTime()-t0)/((t1-t0)||1))*(W-pad.l-pad.r-120),Y=a=>pad.t+(mx-a)/(mx-mn)*(h-pad.t-pad.b);
  let g=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${h-pad.b}" y2="${h-pad.b}" stroke="var(--muted)"/>`;
  g+=`<line x1="${X(v[0].date)}" x2="${W-pad.r-60}" y1="${Y(v[0].value*s)}" y2="${Y(v[0].value*s)}" stroke="var(--p5)" stroke-dasharray="4 4"/>
      <text x="${W-pad.r-56}" y="${Y(v[0].value*s)+4}">cost</text>`;
  v.forEach(x=>{const cx=X(x.date);
    if(x.low)g+=`<line x1="${cx}" x2="${cx}" y1="${Y(x.high*s)}" y2="${Y(x.low*s)}" stroke="var(--p4)" stroke-width="6" stroke-linecap="round" opacity=".6"/>`;
    g+=`<circle cx="${cx}" cy="${Y(x.value*s)}" r="${x.kind==="purchase"?4.5:5}" fill="${x.kind==="purchase"?"var(--surface)":"var(--p3)"}" stroke="var(--p2)" stroke-width="2"/>
        <text class="lbl" x="${cx}" y="${Y(x.value*s)-10}" text-anchor="middle">${kmoney(x.value*s)}</text>
        <text x="${cx}" y="${h-8}" text-anchor="middle">${x.kind==="purchase"?"Bought ":""}${mshort(x.date.slice(0,7))} ${x.date.slice(2,4)}</text>`});
  return `<div class="tw"><svg class="chart" width="100%" viewBox="0 0 ${W} ${h}" style="min-width:420px" role="img">${g}</svg></div>
   <div class="legend"><span>Hollow dot: purchase price</span><span>Filled dot: comps estimate, bar shows low to high range</span></div>`;
}

  return `<div class="alerts">${list.map(a=>`<div class="alert ${a.level}"><div class="g" aria-hidden="true">${glyph[a.level]}</div>
   <div><div class="t"><span class="w">${word[a.level]}</span>${esc(a.title)}</div>
   <div class="s">${esc(a.property)}${a.detail?" · "+esc(a.detail):""}</div></div></div>`).join("")}</div>`;

function plTable(months,{title=true}={}){
  if(!months.length)return`<div class="empty">No operating months yet.</div>`;
  const lines=[...new Set(months.flatMap(m=>Object.keys(m.opex)))];
  const head=`<tr><th class="l">Month</th><th>Source</th><th>Rent</th>${lines.map(l=>`<th>${esc(l)}</th>`).join("")}<th>NOI</th><th>Interest</th><th>Principal</th><th>Cash flow</th></tr>`;
  const body=months.slice().reverse().map(m=>`<tr><td class="l">${mlabel(m.month)}</td><td>${badge(m.source)}</td>
    <td class="${m.source!=="actual"?"mod":""}">${money(m.rent)}</td>
    ${lines.map(l=>`<td class="${m.source!=="actual"||m.modelled_lines.includes(l)?"mod":""}">${m.opex[l]!=null?money(-m.opex[l]):""}</td>`).join("")}
    <td>${money(m.noi)}</td><td>${m.interest?money(-m.interest):""}</td><td>${m.principal?money(-m.principal):""}</td><td><b>${money(m.cash_flow)}</b></td></tr>`).join("");
  const sum=k=>months.reduce((a,m)=>a+(m[k]||0),0);
  const tot=`<tr class="total"><td class="l">Since possession</td><td></td><td>${money(sum("rent"))}</td>
    ${lines.map(l=>`<td>${money(-months.reduce((a,m)=>a+(m.opex[l]||0),0))}</td>`).join("")}
    <td>${money(sum("noi"))}</td><td>${money(-sum("interest"))}</td><td>${money(-sum("principal"))}</td><td>${money(sum("cash_flow"))}</td></tr>`;
  return `<div class="tw"><table>${head}${body}${tot}</table></div>
  <p class="note">Italic grey figures are modelled from the property's configured terms (no statement yet, or no transaction tagged to that line). Principal is shown in the cash flow but it builds equity, so it is added back in the investment view.</p>`;
}

     <div class="panel"><h2>Facts</h2><dl class="kv">${facts.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></div>
     <div class="panel"><h2>Financing</h2><dl class="kv">${mtg.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></div>
     <div class="panel"><h2>Lease and tenant</h2>${L?`<dl class="kv"><dt>Tenant</dt><dd>${esc(L.tenant)||"Not on file"}</dd><dt>Term</dt><dd>${L.start?dlabel(L.start):"?"} to ${L.end?dlabel(L.end):"open"}</dd><dt>Rent</dt><dd>${money(+L.monthly_rent)}</dd><dt>Deposit held</dt><dd>${L.deposit_held?money(+L.deposit_held):"n/a"}</dd><dt>Status</dt><dd>${esc(L.status)}</dd></dl>`:`<div class="empty">No lease on file.</div>`}
       ${R?`<p class="note" style="margin-top:8px">Next increase: serve N1 by <b>${dlabel(R.serve_n1_by)}</b>, effective ${dlabel(R.effective)}${R.guideline?`, capped at the ${(R.guideline*100).toFixed(1)}% guideline`:""}.</p>`:""}</div>
     <div class="panel"><h2>Rent vs market</h2>${rentVs}</div>
   </div>
   ${p.months.length?`<div class="panel"><h2>Monthly cash flow</h2>${bars(p.months.slice(-18))}</div><div class="panel"><h2>Monthly P&amp;L${shTag(p)}</h2>${plTable(p.months)}</div>`:""}
   ${s.stage==="pre-construction"?preCon(p):""}
   <div class="panel"><h2>Value history</h2>${valueChart(p)}</div>
   <div class="grid two"><div class="panel"><h2>Documents</h2>${docList(p.docs)}</div><div class="panel"><h2>Maintenance</h2>${maintList(p.maintenance)}</div></div>
  </div>`;
}
const DOC_TYPES=["Purchase agreement","Amendment","Closing / Adjustments","Mortgage / Financing","Lease","Tenant","Property tax","Insurance","Condo corporation","Floor plan / Specs","Builder correspondence","Utilities","Other"];
const kb=n=>n==null?"":n>=1048576?(n/1048576).toFixed(1)+" MB":Math.round(n/1024)+" KB";
const docRow=(x,showProp)=>`<tr><td class="l">${x.asset_url?`<a href="${esc(x.asset_url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`:`${esc(x.name)}`}${x.notes?`<div class="note">${esc(x.notes)}</div>`:""}</td>${showProp?`<td class="l">${esc((byId[x.property_id]||{}).label||x.property_id)}</td>`:""}<td class="l">${esc(x.doc_type)}</td><td class="l">${dlabel(x.date)}</td><td class="l">${esc(x.source||"")}</td><td>${kb(x.size_bytes)}</td></tr>`;
const docTable=(list,showProp)=>`<div class="tw"><table><tr><th class="l">Document</th>${showProp?'<th class="l">Property</th>':""}<th class="l">Type</th><th class="l">Dated</th><th class="l">From</th><th>Size</th></tr>${list.map(x=>docRow(x,showProp)).join("")}</table></div>`;
const docList=d=>{if(!d.length)return`<div class="empty">No documents on file yet.</div>`;
  const types=DOC_TYPES.filter(t=>d.some(x=>x.doc_type===t)).concat([...new Set(d.map(x=>x.doc_type))].filter(t=>!DOC_TYPES.includes(t)));
  return types.map(t=>`<h3 style="margin:12px 0 6px">${esc(t)} (${d.filter(x=>x.doc_type===t).length})</h3>${docTable(d.filter(x=>x.doc_type===t),false)}`).join("")+`<p class="note" style="margin-top:8px"><a href="#docs" data-tab="docs">Open the full document library</a></p>`};
let docProp="all",docType="all",docQ="";
function docsBody(){
  const all=D.documents||[];
  const list=all.filter(x=>(docProp==="all"||x.property_id===docProp)&&(docType==="all"||x.doc_type===docType)&&(!docQ||(x.name+" "+(x.notes||"")+" "+(x.source||"")).toLowerCase().includes(docQ)));
  return list.length?docTable(list,docProp==="all"):`<div class="empty">No documents match these filters.</div>`;
}
views.docs=()=>{
  const all=D.documents||[];
  const types=DOC_TYPES.filter(t=>all.some(x=>x.doc_type===t));
  const cnt=(f)=>all.filter(f).length;
  const matrix=`<div class="tw"><table><tr><th class="l">Type</th>${P.map(p=>`<th>${esc(p.label)}</th>`).join("")}<th>Total</th></tr>${types.map(t=>`<tr><td class="l">${esc(t)}</td>${P.map(p=>`<td>${cnt(x=>x.doc_type===t&&x.property_id===p.id)||""}</td>`).join("")}<td><b>${cnt(x=>x.doc_type===t)}</b></td></tr>`).join("")}</table></div>`;
  return `<div class="panel"><h2>Document library</h2>
   <p class="note" style="margin-bottom:12px">${all.length} documents. Sample index only. In the live tool each entry links to the stored file.</p>
   <div class="selector" role="group" aria-label="Filter by property" style="margin-bottom:8px"><button data-dprop="all" aria-pressed="${docProp==="all"}">All properties</button>${P.map(p=>`<button data-dprop="${p.id}" aria-pressed="${docProp===p.id}">${esc(p.label)}</button>`).join("")}</div>
   <div class="selector" role="group" aria-label="Filter by type" style="margin-bottom:10px"><button data-dtype="all" aria-pressed="${docType==="all"}">All types</button>${types.map(t=>`<button data-dtype="${esc(t)}" aria-pressed="${docType===t}">${esc(t)}</button>`).join("")}</div>
   <input id="docq" type="search" placeholder="Search documents" value="${esc(docQ)}" style="font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;width:100%;max-width:340px;margin-bottom:10px;background:var(--surface);color:var(--ink)">
   <div id="docbody">${docsBody()}</div></div>
  <div class="panel"><h2>Coverage by property and type</h2>${matrix}<p class="note" style="margin-top:8px">Gaps here are documents worth requesting.</p></div>`;
};
const maintList=m=>m.length?`<div class="tw"><table><tr><th class="l">Opened</th><th class="l">Issue</th><th class="l">Status</th><th>Cost</th></tr>${m.map(x=>`<tr><td class="l">${dlabel(x.opened)}</td><td class="l">${esc(x.issue)}</td><td class="l">${esc(x.status)}</td><td>${x.cost?money(+x.cost):""}</td></tr>`).join("")}</table></div>`:`<div class="empty">No maintenance logged. Report a repair and it goes here with its cost and status.</div>`;

views.pl=()=>{
  const months=T.monthly.map(m=>m.month);
  const head=`<tr><th class="l">Property</th>${months.slice(-12).map(m=>`<th>${mshort(m)} ${m.slice(2,4)}</th>`).join("")}<th>12 mo total</th></tr>`;
  const row=(name,get,cls="")=>{const v=months.slice(-12).map(get);return`<tr class="${cls}"><td class="l">${name}</td>${v.map((x,i)=>`<td class="${T.monthly.slice(-12)[i].source!=="actual"?"mod":""}">${x==null?"":money(x)}</td>`).join("")}<td><b>${money(v.reduce((a,b)=>a+(b||0),0))}</b></td></tr>`};
  const pm=(p,m,k)=>{const r=p.months.find(x=>x.month===m);return r?r[k]:null};
  let body="";
  for(const [k,name] of [["rent","Rent received"],["opex_total","Operating costs"],["noi","NOI"],["debt","Mortgage payments"],["cash_flow","Cash flow"]]){
    body+=`<tr class="sub"><td class="l" colspan="14"><b>${name}</b></td></tr>`;
    rented.forEach(p=>body+=row(esc(p.label),m=>{const v=pm(p,m,k);return v==null?null:(k==="opex_total"||k==="debt"?-v:v)}));
    body+=row("Total",m=>{const r=T.monthly.find(x=>x.month===m);return r?(k==="opex_total"||k==="debt"?-r[k]:r[k]):null},"total");
  }
  const lines={};rented.forEach(p=>p.months.filter(m=>m.month>=months.slice(-12)[0]).forEach(m=>Object.entries(m.opex).forEach(([l,v])=>lines[l]=(lines[l]||0)+v)));
  const T776={"Condo fees":"9270","Property tax":"9180","Repairs and maintenance":"8960","Occupancy fee":"9270","Insurance":"8690","Utilities":"9220","Other":"9270"};
  const interest=rented.reduce((a,p)=>a+p.months.slice(-12).reduce((b,m)=>b+m.interest,0),0);
  return `<div class="panel"><h2>Last 12 months by property${shTag()}</h2><div class="tw"><table>${head}${body}</table></div>
   <p class="note">Italic grey columns are modelled months. Actuals run through ${mlabel(D.actuals_through)}.</p></div>
   <div class="panel"><h2>Expenses by CRA T776 line, last 12 months</h2><div class="tw"><table><tr><th class="l">Expense</th><th class="l">T776 line</th><th>Amount</th></tr>
   ${Object.entries(lines).map(([l,v])=>`<tr><td class="l">${esc(l)}</td><td class="l">${T776[l]||"9270"}</td><td>${money(v)}</td></tr>`).join("")}
   <tr><td class="l">Mortgage interest</td><td class="l">8710</td><td>${money(interest)}</td></tr></table></div>
   <p class="note">A planning view for the T776 rental schedule, not a tax filing. Interest is modelled from the mortgage terms. Occupancy fees on the interim-occupancy unit are deductible only in part, so confirm the treatment with the accountant.</p></div>`;
};

views.leases=()=>{
  const rows=P.map(p=>{const L=p.lease,R=p.rent_rule,f=p.facts,mr=p.market_rent;return`<tr><td class="l"><b>${esc(p.label)}</b></td><td class="l">${esc(L?.tenant)||"Not on file"}</td>
    <td>${money(f.monthly_rent)}</td><td>${mr?money(+mr.market_rent):"n/a"}</td><td class="l">${L?.start?dlabel(L.start):"?"} to ${L?.end?dlabel(L.end):"open"}</td>
    <td>${L?.deposit_held?money(+L.deposit_held):"n/a"}</td><td class="l">${f.rent_controlled===false?"Exempt":f.rent_controlled?"Controlled":"Unconfirmed"}</td>
    <td class="l">${R?dlabel(R.serve_n1_by):"n/a"}</td><td class="l">${R?dlabel(R.effective):"n/a"}</td><td class="l">${esc(L?.status||(s=>s)(p.summary.stage==="pre-construction"?"Not built":""))}</td></tr>`}).join("");
  return `<div class="panel"><h2>Rent roll (100% of each unit)</h2><div class="tw"><table>
   <tr><th class="l">Property</th><th class="l">Tenant</th><th>Rent</th><th>Market</th><th class="l">Term</th><th>Deposit</th><th class="l">Rent control</th><th class="l">Serve N1 by</th><th class="l">Increase from</th><th class="l">Status</th></tr>${rows}</table></div></div>
   <div class="panel"><h2>Ontario rules used here</h2><ul class="note" style="padding-left:18px;margin:0;display:grid;gap:4px">
    <li>Rent can rise once every 12 months, with an N1 notice served at least 90 days before.</li>
    <li>Rent-controlled units are capped at the guideline: ${Object.entries(D.rent_guideline).map(([y,v])=>`${y}: ${(v*100).toFixed(1)}%`).join(", ")}.</li>
    <li>Units first occupied after November 15, 2018 are exempt from the guideline, but the 12-month and N1 rules still apply.</li>
    <li>When a fixed term ends, the tenancy continues month to month on the same terms unless a new lease is signed.</li></ul></div>`;
};

views.calendar=()=>{
  const today=D.as_of,items=D.calendar;
  return `<div class="grid two"><div class="panel"><h2>Key dates</h2>${items.length?`<div class="cal">${items.map(c=>`<div class="row ${c.date<today?"past":""}"><div class="dt">${dlabel(c.date)}</div>
     <div><b>${esc(c.event)}</b> ${badge(c.certainty==="confirmed"?"confirmed":c.certainty==="computed"?"estimate":"modelled")}<div class="note">${esc(c.label)}${c.notes?" · "+esc(c.notes):""}</div></div></div>`).join("")}</div>`:`<div class="empty">No dates yet.</div>`}</div>
   <div class="panel"><h2>All alerts</h2>${alertList(D.alerts)}</div></div>`;
};

views.maint=()=>`<div class="grid two"><div class="panel"><h2>Maintenance log</h2>${maintList(P.flatMap(p=>p.maintenance.map(m=>({...m,issue:p.label+": "+m.issue}))))}</div>
  <div class="panel"><h2>Capital improvements</h2>${P.some(p=>p.capex.length)?`<div class="tw"><table><tr><th class="l">Date</th><th class="l">Property</th><th class="l">Item</th><th>Amount</th></tr>${P.flatMap(p=>p.capex.map(c=>`<tr><td class="l">${dlabel(c.date)}</td><td class="l">${esc(p.label)}</td><td class="l">${esc(c.description)}</td><td>${money(+c.amount)}</td></tr>`)).join("")}</table></div>`:`<div class="empty">None recorded. Capital improvements add to cost basis and cash invested.</div>`}</div></div>
  <div class="panel"><h2>Documents</h2><p class="note">All property documents now live in the <a href="#docs" data-tab="docs">Documents</a> tab, filterable by property and type.</p></div>`;

views.quality=()=>{
  const Q=D.quality,mon=["J","F","M","A","M","J","J","A","S","O","N","D"];
  const cov=Object.entries(Q.coverage).map(([a,ms])=>`<tr><td class="l">${esc(a)}</td>${mon.map((m,i)=>`<td style="text-align:center">${ms.includes(i+1)?"&#9632;":"<span style='color:var(--muted)'>&middot;</span>"}</td>`).join("")}</tr>`).join("");
  return `<div class="panel"><h2>How to read the numbers</h2><div class="legend">${badge("actual")} from reconciled bank statements ${badge("modelled")} from configured terms until real data arrives ${badge("estimate")} from monthly comps research</div>
    <p class="note" style="margin-top:8px">Actuals run through ${mlabel(D.actuals_through)}. Months after that, and all months before January 2026, are modelled. Built ${esc(D.generated)}.</p></div>
   <div class="panel"><h2>2026 statement coverage</h2><div class="tw"><table><tr><th class="l">Account</th>${mon.map(m=>`<th style="text-align:center">${m}</th>`).join("")}</tr>${cov}</table></div><p class="note">&#9632; = statement loaded and reconciled.</p></div>
   <div class="grid two">
    <div class="panel"><h2>Missing facts</h2><div class="tw"><table><tr><th class="l">Property</th><th class="l">Needed</th></tr>${Q.gaps.map(g=>`<tr><td class="l">${esc(g.property)}</td><td class="l">${esc(g.item)}</td></tr>`).join("")}</table></div></div>
    <div class="panel"><h2>Open questions from the budget</h2>${Q.tbd.length?`<div class="tw"><table><tr><th class="l">Date</th><th class="l">Line</th><th>Amount</th></tr>${Q.tbd.map(t=>`<tr><td class="l">${dlabel(t.date)}</td><td class="l">${esc(t.desc)} (${t.direction.toLowerCase()})</td><td>${money(t.amount,2)}</td></tr>`).join("")}</table></div>`:`<div class="empty">None.</div>`}</div>
   </div>
   <div class="panel"><h2>Property-type costs with no property tag</h2>${Q.untagged.length?`<div class="tw"><table><tr><th class="l">Date</th><th class="l">Description</th><th class="l">Category</th><th>Amount</th></tr>${Q.untagged.map(t=>`<tr><td class="l">${dlabel(t.date)}</td><td class="l">${esc(t.desc)}</td><td class="l">${esc(t.category)}</td><td>${money(t.amount,2)}</td></tr>`).join("")}</table></div>`:`<div class="empty">Everything is tagged.</div>`}</div>`;
};

/* ---------- shell ---------- */
const TABS=[["overview","Overview"],["investment","Investment"],["properties","Properties"],["docs","Documents"],["pl","Monthly P&L"],["leases","Leases"],["calendar","Dates & alerts"],["maint","Maintenance"],["quality","Data quality"]];
$("#meta").innerHTML=`<span>As of <b>${dlabel(D.as_of)}</b></span><span>Actuals through <b>${mlabel(D.actuals_through)}</b></span><span>${"Demo: fictional properties and figures"}</span>`;
$("#tabs").innerHTML=TABS.map(([id,n])=>`<button role="tab" id="t-${id}" data-tab="${id}" aria-selected="false">${n}</button>`).join("");
function setHash(h){try{history.replaceState(null,"","#"+h)}catch(e){}}
function show(id){
  if(!views[id])id="overview";
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===id));
  $("#app").innerHTML=`<section class="view" role="tabpanel" aria-labelledby="t-${id}">${views[id]()}<p class="foot">Sample data. All properties, people and figures on this page are fictional.</p></section>`;
  try{localStorage.setItem("pf-tab",id)}catch(e){}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");if(t){setHash(t.dataset.tab);show(t.dataset.tab);return}
  const g=e.target.closest("[data-go]");if(g){curProp=g.dataset.go;setHash("properties");show("properties");window.scrollTo(0,0);return}
  const dp=e.target.closest("[data-dprop]");if(dp){docProp=dp.dataset.dprop;show("docs");return}
  const dt=e.target.closest("[data-dtype]");if(dt){docType=dt.dataset.dtype;show("docs");return}
  const pr=e.target.closest("[data-prop]");if(pr){curProp=pr.dataset.prop;document.querySelectorAll("[data-prop]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.prop===curProp));$("#propbody").innerHTML=propDetail(byId[curProp])}
});
document.addEventListener("input",e=>{if(e.target.id==="docq"){docQ=e.target.value.trim().toLowerCase();$("#docbody").innerHTML=docsBody()}});
let start=(location.hash||"").slice(1);
if(!views[start]){try{start=localStorage.getItem("pf-tab")||"overview"}catch(e){start="overview"}}
show(start);
})();
</script>
